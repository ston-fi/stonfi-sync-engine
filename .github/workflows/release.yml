name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish-github-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
