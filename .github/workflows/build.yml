name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install nightly --component rustfmt
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo test --workspace --examples --locked
      - run: cargo +nightly fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc --workspace --no-deps --all-features --locked
      - run: cargo package --list --locked -p stonfi_sync_core
      - run: cargo package --list --locked -p stonfi_distributed_sync
      - run: cargo publish --dry-run --locked -p stonfi_sync_core

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --workspace --all-features --locked

  external-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: bash .github/check-external-consumer.sh
