name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install nightly --component rustfmt
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo test --workspace --examples --locked
      - run: cargo +nightly fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc --workspace --no-deps --all-features --locked
      - run: cargo package --list --locked -p stonfi_sync_core
      - run: cargo package --list --locked -p stonfi_distributed_sync

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: cargo check --workspace --all-features --locked

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
