[package]
name = "stonfi_distributed_sync"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
description = "Distributed gRPC workers for STON.fi synchronization engines"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish.workspace = true

include = [
    "AGENTS.md",
    "CHANGELOG.md",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "build.rs",
    "examples/**",
    "proto/**",
    "src/**",
]

[lib]
name = "stonfi_distributed_sync"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bincode = { version = "2", features = ["derive"] }
futures = "0.3"
parking_lot = "0.12"
prost = "0.14"
stonfi_metrics.workspace = true
stonfi_sync_core = { version = "0.0.3", path = "../sync_core" }
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
