[package]
name = "stonfi_sync_core"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Dependency-aware asynchronous synchronization engine"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish.workspace = true

include = [
    "AGENTS.md",
    "CHANGELOG.md",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "examples/**",
    "src/**",
]

[lib]
name = "stonfi_sync_core"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
stonfi_metrics.workspace = true
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "smallvec", "tracing-log"] }
