[package]
name = "stonfi_sync_core"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Dependency-aware asynchronous synchronization engine"
license.workspace = true
repository.workspace = true
readme = "README.md"

include = [
    "AGENTS.md",
    "CHANGELOG.md",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "examples/**",
    "src/**",
    "tests/**",
]

[lib]
name = "stonfi_sync_core"

[features]
default = []
scylla = ["dep:stonfi_scylla_client"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
stonfi_metrics.workspace = true
stonfi_scylla_client = { workspace = true, optional = true }
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
testcontainers.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[[test]]
name = "test_scylla_progress_store"
required-features = ["scylla"]

[[example]]
name = "scylla"
required-features = ["scylla"]
